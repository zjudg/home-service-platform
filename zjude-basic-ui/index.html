<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
  <meta name="renderer" content="webkit">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <link rel="icon" href="/favicon.ico">
  <title>妙洁家政服务管理平台</title>
  <!--[if lt IE 11]><script>window.location.href='/html/ie.html';</script><![endif]-->
  <style>
    html,
    body,
    #app {
      height: 100%;
      margin: 0;
      padding: 0;
    }

    .chromeframe {
      margin: 0.2em 0;
      background: #ccc;
      color: #000;
      padding: 0.2em 0;
    }

    #loader-wrapper {
      position: fixed;
      inset: 0;
      z-index: 999999;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      background:
        radial-gradient(circle at 88% 6%, rgba(249, 213, 197, 0.55), transparent 32%),
        radial-gradient(circle at 30% 82%, rgba(253, 236, 228, 0.9), transparent 44%),
        #faf7f5;
      transition: opacity 0.45s ease;
    }

    #loader-wrapper::before {
      content: "";
      position: absolute;
      inset: 0;
      opacity: 0.85;
      background-image:
        linear-gradient(rgba(224, 106, 61, 0.06) 1px, transparent 1px),
        linear-gradient(90deg, rgba(224, 106, 61, 0.06) 1px, transparent 1px);
      background-size: 44px 44px;
      mask-image: linear-gradient(to bottom, black, transparent 90%);
    }

    #loader {
      position: relative;
      width: min(460px, calc(100% - 40px));
      padding: 34px 38px 32px;
      border: 1px solid #f2ede9;
      border-radius: 20px;
      background: #fff;
      box-shadow: 0 16px 48px rgba(31, 28, 26, 0.08);
      text-align: left;
      z-index: 1001;
      transition: opacity 0.3s ease, transform 0.3s ease;
    }

    #loader::after {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      top: 0;
      height: 2px;
      border-radius: 20px 20px 0 0;
      background: linear-gradient(90deg, #f58a5f, #e06a3d, #f58a5f);
      background-size: 200% 100%;
      animation: scan 2.4s linear infinite;
    }

    .loader-brand {
      display: flex;
      align-items: center;
      gap: 11px;
      color: #1f1c1a;
      font: 700 18px/1 -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", Arial, sans-serif;
      letter-spacing: 0.06em;
    }

    .loader-brand small {
      margin-left: 2px;
      color: #c9582d;
      font-size: 9px;
      letter-spacing: 0.2em;
      font-weight: 700;
    }

    .loader-mark {
      display: inline-flex;
      width: 34px;
      height: 34px;
      align-items: center;
      justify-content: center;
      border-radius: 11px;
      color: #fff;
      background: #e06a3d;
      box-shadow: 0 6px 16px rgba(224, 106, 61, 0.24);
      font-size: 17px;
      letter-spacing: 0;
    }

    .loader-status {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 32px;
      color: #1f1c1a;
      font: 600 14px/1.4 -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", Arial, sans-serif;
    }

    .loader-status::before {
      content: "";
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #2f9e6b;
      animation: pulse 1.4s ease-in-out infinite;
    }

    .loader-subtitle {
      margin-top: 7px;
      color: #a39b95;
      font: 11px/1.5 -apple-system, BlinkMacSystemFont, "PingFang SC", Arial, sans-serif;
      letter-spacing: 0.06em;
    }

    .loader-track {
      height: 6px;
      margin-top: 24px;
      overflow: hidden;
      border-radius: 999px;
      background: #f2ede9;
    }

    .loader-track span {
      display: block;
      width: 0;
      height: 100%;
      border-radius: 999px;
      background: linear-gradient(90deg, #f58a5f, #e06a3d);
      /* 约 2 秒推进到 100%，随后保持满格等待应用挂载 */
      animation: progress 2s cubic-bezier(0.35, 0, 0.2, 1) forwards;
    }

    .loader-percent {
      margin-top: 10px;
      color: #a39b95;
      font: 600 11px/1 Arial, sans-serif;
      letter-spacing: 0.08em;
      text-align: right;
    }

    @keyframes scan {
      to { background-position: 200% 0; }
    }

    @keyframes pulse {
      50% { opacity: 0.35; transform: scale(0.72); }
    }

    @keyframes progress {
      0% { width: 4%; }
      35% { width: 46%; }
      70% { width: 78%; }
      100% { width: 100%; }
    }

    .loaded #loader {
      opacity: 0;
      transform: translateY(-6px);
    }

    .loaded #loader-wrapper {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .no-js #loader-wrapper {
      display: none;
    }

    .no-js h1 {
      color: #222222;
    }

    @media (prefers-reduced-motion: reduce) {
      #loader::after,
      .loader-status::before {
        animation: none;
      }
      .loader-track span {
        animation: none;
        width: 100%;
      }
    }

  </style>
</head>

<body>
  <div id="app">
    <div id="loader-wrapper">
      <div id="loader">
        <div class="loader-brand">
          <span class="loader-mark">妙</span>
          <span>妙洁家政</span>
          <small>服务管理平台</small>
        </div>
        <div class="loader-status">正在加载妙洁家政服务管理平台</div>
        <div class="loader-subtitle">Loading MiaoJie Home Service Platform</div>
        <div class="loader-track"><span></span></div>
        <div class="loader-percent">LOADING</div>
      </div>
    </div>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>

</html>
