server {
    listen    80;
    server_name  miaoj.cc;
    rewrite ^/(.*)$ https://miaoj.cc permanent;
    charset utf-8;
}
server {
    listen    443 ssl;
    server_name  miaoj.cc;
    charset utf-8;

    access_log  /data/log/nginx/access.log  main;
    error_log   /data/log/nginx/error.log;

    ssl_certificate      /etc/nginx/ssl/cert.pem;
    ssl_certificate_key  /etc/nginx/ssl/cert.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers on;

    location / {
           alias   /data/web/company/;
           try_files $uri $uri/ /index.html;
           index  index.html index.htm;
    }

    location ^~ /admin {
               alias   /data/web/management/;
               try_files $uri $uri/ /admin/index.html;
               index  index.html index.htm;
         # 处理 HTML 不缓存
         location ~* \.html$ {
             add_header Cache-Control "no-cache, no-store, must-revalidate";
         }

         # 静态资源缓存
         location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
             expires 1y;
             add_header Cache-Control "public, immutable";
         }
    }


    location ^~/dev-api/ {
            proxy_set_header Host $host;    # 设置请求头中的Host字段
            proxy_set_header X-Real-IP $remote_addr;  # 设置请求头中的真实IP地址
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;  # 设置请求头中的转发地址
            proxy_set_header X-Forwarded-Proto $scheme;  # 设置请求头中的协议类型
            client_max_body_size  100m;
            proxy_pass http://prod-api-instance:9528/;
    }
    # 文件上传路径
    location /profile/ {
           # 服务器文件上传路径
           proxy_pass http://localhost:9528/profile/;
           alias /files;
    }
}
