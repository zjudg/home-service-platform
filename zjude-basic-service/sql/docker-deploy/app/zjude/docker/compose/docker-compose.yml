version: '3.8'
networks:
  zjudg-system-network:
    driver: overlay
    external: true
services:
  prod-api-instance:
    deploy:
      replicas: 1
      resources:
        limits:
          memory: 1G
      restart_policy:
        condition: on-failure
      update_config:
        parallelism: 2
    image: crpi-e6fwkw3sau3mvpx9.cn-chengdu.personal.cr.aliyuncs.com/zjudg/zjudg-system-admin:v20261106_f1
    networks:
      - zjudg-system-network
    volumes:
      - /app/aden/docker/logs:/log
      - /app/aden/file/upload:/files
      - /etc/localtime:/etc/localtime
  nginx-instance:
    deploy:
      placement:
        constraints:
          - node.role == manager
      replicas: 1
      restart_policy:
        condition: on-failure
      update_config:
        parallelism: 2
    image: crpi-e6fwkw3sau3mvpx9.cn-chengdu.personal.cr.aliyuncs.com/zjudg/zjudg-system-nginx:v20261105_f1
    networks:
      - zjudg-system-network
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /app/aden/docker/logs:/data/log/nginx
      - /app/aden/docker/nginx/ssl:/etc/nginx/ssl
  redis-instance:
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
      update_config:
        parallelism: 2
    image: m.daocloud.io/docker.io/library/redis:7.0.8
    command: redis-server /etc/redis/redis.conf
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - zjudg-system-network
    volumes:
      - /app/aden/docker/redis/redis.conf:/etc/redis/redis.conf
      - /app/aden/docker/redis/data:/data